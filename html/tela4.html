<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz ANOS 2000 • Tela 2</title>

    <link rel="stylesheet" href="../css/tela4.css">
    <link rel="stylesheet" href="../css/visual.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/card.css">
    <link rel="stylesheet" href="../css/paginas.css">


    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700;900&display=swap" rel="stylesheet">

</head>

<body>

    <!-- Background blobs -->

    <div class="bg-shape shape1"></div>
    <div class="bg-shape shape2"></div>
    <div class="bg-shape shape3"></div>

    <!-- Cursor -->

    <div class="cursor-glow"></div>

    <!-- Partículas -->

    <div class="particles"></div>

    <!-- Conteúdo -->

    <main class="quiz-container">

        <!-- Progress -->

        <section class="top-area fade-up">

            <div class="progress-info">

                <span class="mini-title">
                    💿 QUIZ ANOS 2000
                </span>

                <span class="progress-text">
                    Pergunta 5-6 de 8
                </span>

            </div>

            <div class="progress-bar">

                <div class="progress-fill"></div>

            </div>

        </section>

         <div class="quiz-wrapper">

        <!-- Card -->

        <section class="quiz-card fade-scale">
            

            <!-- Pergunta 1 -->

            <div class="question-box slide-left">

                <span class="question-number">
                    Pergunta 5
                </span>

                <h1 class="question">
                    Em um grupo, você geralmente vira…
                </h1>

                <div class="options">

                    <button class="option" onclick="somarPontos(['regina','mcqueen'])">
                        💪 A pessoa que toma iniciativa sem perceber.
                    </button>

                    <button class="option" onclick="somarPontos(['lindinha','alex'])">
                        💗 O apoio emocional do rolê.
                    </button>

                    <button class="option" onclick="somarPontos(['stitch','scooby','docinho'])">
                        🎭 A personalidade imprevisível da equipe.
                    </button>

                    <button class="option" onclick="somarPontos(['sam','clover'])">
                        🧠 A mente estratégica por trás das ideias.
                    </button>

                </div>

            </div>

            <!-- Pergunta 2 -->

            <div class="question-box slide-right">

                <span class="question-number">
                    Pergunta 6
                </span>

                <h1 class="question">
                    O que mais chama atenção em você?
                </h1>

                <div class="options">

                    <button class="option" onclick="somarPontos(['regina','docinho'])">
                        🔥 Presença forte.
                    </button>

                    <button class="option" onclick="somarPontos(['superchoque','scooby'])">
                        😂 Humor e espontaneidade.
                    </button>

                    <button class="option" onclick="somarPontos(['sam','clover'])">
                        👀 Inteligência e observação.
                    </button>

                    <button class="option" onclick="somarPontos(['stitch','lindinha'])">
                        ✨ Energia única e autenticidade.
                    </button>

                </div>

            </div>

            <!-- Botão -->
           <p class="erro-msg">
           ⚠️ Responda as duas perguntas antes de continuar.
          </p>

           <div class="button-area fade-up">

    <a href="tela5.html" class="next-btn">
        CONTINUAR
    </a>

</div>

        </section>

<!-- PERSONAGEM -->

<div class="visual-area">

    <img
    src="../img/docinho (1).png"
    class="main-character">
</div>
</div>
</main>
<script src="../js/json.js"></script>
<script src="../js/telas.js"></script>

</body>
</html>
