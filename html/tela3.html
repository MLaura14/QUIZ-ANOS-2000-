<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz ANOS 2000 • Tela 2</title>

    <link rel="stylesheet" href="../css/tela3.css">
    <link rel="stylesheet" href="../css/visual.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/card.css">
    <link rel="stylesheet" href="../css/paginas.css">


    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700;900&display=swap" rel="stylesheet">

</head>

<body>

    <!-- Background blobs -->

    <div class="bg-shape shape1"></div>
    <div class="bg-shape shape2"></div>
    <div class="bg-shape shape3"></div>

    <!-- Cursor -->

    <div class="cursor-glow"></div>

    <!-- Partículas -->

    <div class="particles"></div>

    <!-- Conteúdo -->

    <main class="quiz-container">

        <!-- Progress -->

        <section class="top-area fade-up">

            <div class="progress-info">

                <span class="mini-title">
                    💿 QUIZ ANOS 2000
                </span>

                <span class="progress-text">
                    Pergunta 3-4 de 8
                </span>

            </div>

            <div class="progress-bar">

                <div class="progress-fill"></div>

            </div>

        </section>

         <div class="quiz-wrapper">

        <!-- Card -->

        <section class="quiz-card fade-scale">
            

            <!-- Pergunta 1 -->

            <div class="question-box slide-left">

                <span class="question-number">
                    Pergunta 3
                </span>

                <h1 class="question">
                    Quando alguém subestima você, sua reação normalmente é…
                </h1>

                <div class="options">

                    <button class="option" onclick="somarPontos(['sam','mcqueen'])">
                        👀 Provar silenciosamente que estavam errados.
                    </button>

                    <button class="option" onclick="somarPontos(['scooby','superchoque'])">
                        😂 Fazer piada e seguir a vida.
                    </button>

                    <button class="option" onclick="somarPontos(['docinho','alex'])">
                        🚀 Transformar isso em motivação.
                    </button>

                    <button class="option" onclick="somarPontos(['regina','clover'])">
                        💅 Fingir que não liga… mas ligar um pouquinho.
                    </button>

                </div>

            </div>

            <!-- Pergunta 2 -->

            <div class="question-box slide-right">

                <span class="question-number">
                    Pergunta 4
                </span>

                <h1 class="question">
                    Qual dessas frases parece ter saído diretamente da sua mente?
                </h1>

                <div class="options">

                    <button class="option" onclick="somarPontos(['stitch','mcqueen','docinho'])">
                        ⚡ Eu preciso de emoção ou vou enlouquecer.
                    </button>

                    <button class="option" onclick="somarPontos(['sam','regina'])">
                        🕶️ Se for pra fazer, tem que ficar perfeito!
                    </button>

                    <button class="option" onclick="somarPontos(['lindinha','alex'])">
                        ☁️ Minha paz vale mais que qualquer discussão.
                    </button>

                    <button class="option" onclick="somarPontos(['scooby','superchoque'])">
                        🎉 Tudo fica melhor quando a gente ri.
                    </button>

                </div>

            </div>

            <!-- Botão -->
           <p class="erro-msg">
           ⚠️ Responda as duas perguntas antes de continuar.
          </p>

           <div class="button-area fade-up">

    <a href="tela4.html" class="next-btn">
        CONTINUAR
    </a>

</div>

        </section>

<!-- PERSONAGEM -->

<div class="visual-area">

    <img
    src="../img/choque.png"
    class="main-character">
</div>
</div>
</main>
<script src="../js/json.js"></script>
<script src="../js/telas.js"></script>

</body>
</html>
